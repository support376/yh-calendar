<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>양홍수 변호사 — 촬영·업로드 일정</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Malgun Gothic", sans-serif; background: #fafaf9; color: #1c1917; font-size: 14px; line-height: 1.5; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px; }

  /* ── 헤더 ── */
  header { margin-bottom: 24px; }
  h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .sub { color: #78716c; font-size: 13px; margin-top: 2px; }

  /* ── 상단 KPI ── */
  .stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .stat { background: white; border: 1px solid #e7e5e4; border-radius: 8px; padding: 10px 14px; flex: 1; min-width: 120px; }
  .stat-label { font-size: 11px; color: #78716c; text-transform: uppercase; letter-spacing: .04em; }
  .stat-value { font-size: 22px; font-weight: 700; margin-top: 2px; }

  /* ── 범례 ── */
  .legend { display: flex; gap: 14px; align-items: center; font-size: 12px; color: #57534e; margin-bottom: 14px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 3px; }
  .dot-shoot { background: #3b82f6; }
  .dot-edit { background: #8b5cf6; }
  .dot-upload { background: #22c55e; }
  .dot-done { background: #d6d3d1; }

  /* ── 월 네비 ── */
  .month-nav { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .month-nav button { background: white; border: 1px solid #e7e5e4; border-radius: 6px; padding: 6px 14px; font-size: 13px; cursor: pointer; color: #44403c; font-weight: 500; transition: all .1s; }
  .month-nav button:hover { background: #f5f5f4; }
  .month-label { font-size: 16px; font-weight: 700; min-width: 140px; text-align: center; }

  /* ── 달력 그리드 ── */
  .cal { background: white; border: 1px solid #e7e5e4; border-radius: 10px; padding: 16px; }
  .dow { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 4px; }
  .dow div { text-align: center; font-size: 11px; color: #a8a29e; padding: 4px 0; font-weight: 500; }
  .dow .dow-sun { color: #dc2626; }
  .dow .dow-sat { color: #2563eb; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .day { min-height: 72px; border-radius: 6px; position: relative; padding: 4px 6px; font-size: 12px; color: #1c1917; background: #f5f5f4; border: 1px solid transparent; cursor: default; transition: all .1s ease; display: flex; flex-direction: column; }
  .day.empty { background: transparent; min-height: 0; }
  .day.has-event { cursor: pointer; }
  .day.has-event:hover { transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .day.selected { outline: 2px solid #0284c7; outline-offset: 1px; }
  .day.today { border: 2px solid #0284c7; }
  .day .num { font-weight: 500; margin-bottom: 2px; }
  .day .num.sun { color: #dc2626; }
  .day .num.sat { color: #2563eb; }
  .day .pips { display: flex; flex-direction: column; gap: 2px; margin-top: auto; }
  .pip { font-size: 10px; padding: 1px 4px; border-radius: 3px; color: white; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.4; }
  .pip-촬영 { background: #3b82f6; }
  .pip-편집 { background: #8b5cf6; }
  .pip-업로드 { background: #22c55e; }
  .pip-업로드-예정 { background: white; color: #15803d; border: 1px dashed #22c55e; padding: 0 4px; }
  .pip-done { background: #d6d3d1; color: #44403c; font-weight: 700; }
  .track-badges { position: absolute; top: 4px; right: 6px; display: flex; flex-direction: column; gap: 2px; align-items: flex-end; pointer-events: none; }
  .track-badge { font-size: 9px; padding: 1px 5px; border-radius: 3px; color: white; font-weight: 600; line-height: 1.3; letter-spacing: -0.02em; }
  .track-badge.tb-rehab { background: #0284c7; }
  .track-badge.tb-case { background: #d97706; }

  /* ── 디테일 패널 ── */
  .detail { margin-top: 20px; background: white; border: 1px solid #e7e5e4; border-radius: 10px; padding: 18px; }
  .detail-date { font-size: 16px; font-weight: 700; margin-bottom: 12px; }
  .detail-empty { color: #a8a29e; text-align: center; padding: 16px; }
  .detail-item { padding: 10px 12px; margin-bottom: 8px; border-radius: 8px; background: #fafaf9; border: 1px solid #e7e5e4; }
  .detail-item:last-child { margin-bottom: 0; }
  .detail-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 600; }
  .badge-촬영 { background: #dbeafe; color: #1d4ed8; }
  .badge-편집 { background: #ede9fe; color: #6d28d9; }
  .badge-업로드 { background: #dcfce7; color: #15803d; }
  .badge-cat { background: #fef3c7; color: #92400e; }
  .badge-done { background: #e7e5e4; color: #78716c; }
  .badge-예정 { background: #f0f9ff; color: #0369a1; }
  .badge-doing { background: #fef3c7; color: #92400e; }
  .badge-time { background: #f1f5f9; color: #334155; font-variant-numeric: tabular-nums; font-weight: 700; }
  .detail-title { font-weight: 600; font-size: 14px; color: #1c1917; }
  .detail-id { font-size: 12px; color: #a8a29e; }
  .detail-note { font-size: 12px; color: #57534e; margin-top: 4px; }
  .detail-range { font-size: 12px; color: #57534e; margin-top: 4px; font-weight: 500; padding: 4px 0; }
  .plan-summary { font-size: 13px; color: #44403c; margin-top: 8px; padding: 10px 12px; background: white; border-left: 3px solid #0284c7; border-radius: 4px; line-height: 1.6; }
  .plan-link { display: inline-block; margin-top: 8px; padding: 6px 12px; background: #0284c7; color: white; text-decoration: none; border-radius: 6px; font-size: 12px; font-weight: 600; transition: background .1s; }
  .plan-link:hover { background: #0369a1; }

  /* ── 다가오는 일정 ── */
  .upcoming { margin-top: 24px; }
  .upcoming h2 { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
  .up-list { display: flex; flex-direction: column; gap: 6px; }
  .up-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: white; border: 1px solid #e7e5e4; border-radius: 8px; font-size: 13px; }
  .up-date { font-weight: 600; color: #44403c; min-width: 56px; }
  .up-title { color: #1c1917; flex: 1; }
  .up-none { color: #a8a29e; text-align: center; padding: 16px; }

  /* ── 에러 ── */
  .error-box { background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; padding: 16px; color: #991b1b; text-align: center; margin: 20px 0; }

  /* ── 탭 ── */
  .tabs { display: flex; gap: 4px; margin-bottom: 18px; border-bottom: 1px solid #e7e5e4; }
  .tab { padding: 9px 18px; font-size: 14px; font-weight: 600; background: none; border: none; cursor: pointer; color: #78716c; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all .12s; font-family: inherit; }
  .tab:hover { color: #1c1917; }
  .tab.active { color: #0284c7; border-bottom-color: #0284c7; }
  .panel { display: none; }
  .panel.active { display: block; }

  /* ── 진행 보드 ── */
  .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .col { background: white; border: 1px solid #e7e5e4; border-radius: 10px; padding: 14px; min-height: 220px; }
  .col-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid #f5f5f4; }
  .col-title { font-size: 14px; font-weight: 700; }
  .col-count { background: #f5f5f4; color: #57534e; font-size: 11px; padding: 2px 9px; border-radius: 999px; font-weight: 700; }
  .col-todo .col-title { color: #92400e; }
  .col-wip .col-title { color: #1d4ed8; }
  .col-done .col-title { color: #15803d; }
  .bcard { background: #fafaf9; border: 1px solid #e7e5e4; border-radius: 8px; padding: 12px; margin-bottom: 8px; }
  .bcard:last-child { margin-bottom: 0; }
  .bcard-top { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
  .bcard-title { font-weight: 700; font-size: 14px; line-height: 1.4; margin-bottom: 4px; color: #1c1917; }
  .bcard-progress { display: flex; gap: 5px; align-items: center; margin: 10px 0 8px; }
  .prog-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.05); }
  .prog-dot.done { background: #16a34a; }
  .prog-dot.wip { background: #f59e0b; }
  .prog-dot.upcoming { background: #e7e5e4; }
  .prog-arrow { color: #d6d3d1; font-size: 11px; line-height: 1; }
  .prog-label { margin-left: 6px; font-size: 11px; color: #78716c; font-weight: 500; }
  .bcard-next { font-size: 12px; color: #44403c; margin-top: 6px; padding: 7px 10px; background: white; border-radius: 5px; border-left: 3px solid #0284c7; line-height: 1.5; }
  .bcard-next.done-line { border-left-color: #16a34a; color: #15803d; }
  .bcard-next strong { font-weight: 700; }
  .bcard-note { font-size: 12px; color: #57534e; margin-top: 6px; line-height: 1.5; }
  .bcard .plan-link { margin-top: 8px; }
  .bcard-empty { color: #a8a29e; text-align: center; padding: 36px 12px; font-size: 13px; }
  @media (max-width: 800px) { .board { grid-template-columns: 1fr; } }

  /* ── 반응형 ── */
  @media (max-width: 700px) {
    .wrap { padding: 16px; }
    h1 { font-size: 17px; }
    .day { min-height: 56px; padding: 3px 4px; }
    .day .num { font-size: 11px; }
    .pip { font-size: 9px; }
    .stats { gap: 8px; }
    .stat { min-width: 0; padding: 8px 10px; }
    .stat-value { font-size: 18px; }
  }
  @media (max-width: 400px) {
    .day { min-height: 48px; }
    .pip { display: none; }
    .day.has-event::after { content: ""; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); width: 6px; height: 6px; border-radius: 50%; background: #3b82f6; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>양홍수 변호사 — 촬영·업로드 일정</h1>
    <div class="sub">롱폼 제작 일정 공유용</div>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="calendar">달력</button>
    <button class="tab" data-tab="board">진행 보드</button>
  </div>

  <div class="panel active" id="panel-calendar">
  <div class="stats" id="stats"></div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot dot-shoot"></div>촬영</div>
    <div class="legend-item"><div class="legend-dot dot-edit"></div>편집</div>
    <div class="legend-item"><div class="legend-dot dot-upload"></div>업로드</div>
    <div class="legend-item"><div class="legend-dot dot-done"></div>완료</div>
  </div>

  <div class="month-nav">
    <button id="btn-prev">← 이전</button>
    <div class="month-label" id="month-label"></div>
    <button id="btn-next">다음 →</button>
  </div>

  <div class="cal">
    <div class="dow">
      <div class="dow-sun">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="dow-sat">토</div>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="detail" id="detail">
    <div class="detail-empty">날짜를 클릭하면 그 날의 일정을 볼 수 있어요.</div>
  </div>

  <div class="upcoming" id="upcoming"></div>
  </div>

  <div class="panel" id="panel-board">
    <div class="board" id="board"></div>
  </div>
</div>

<script>
/* ─── 데이터 ─── */
let VIDEOS = [];
let viewYear, viewMonth;

async function loadData() {
  try {
    const res = await fetch("schedule.json?" + Date.now());
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    VIDEOS = data.videos || [];
  } catch (e) {
    document.querySelector(".cal").innerHTML =
      '<div class="error-box">schedule.json을 불러올 수 없습니다.<br>같은 폴더에 파일이 있는지 확인해주세요.</div>';
    return false;
  }
  return true;
}

/* ─── 유틸 ─── */
const DOW = ["일","월","화","수","목","금","토"];
const pad = n => String(n).padStart(2, "0");
const toKey = (y,m,d) => `${y}-${pad(m)}-${pad(d)}`;
const today = () => { const d = new Date(); return toKey(d.getFullYear(), d.getMonth()+1, d.getDate()); };

function fmtKo(s) {
  const [y,m,d] = s.split("-").map(Number);
  return `${y}년 ${m}월 ${d}일 (${DOW[new Date(y,m-1,d).getDay()]})`;
}

function dateRangeLabel(start, end) {
  if (!end || end === start) {
    const [, m, d] = start.split("-").map(Number);
    return `${m}/${d}`;
  }
  const [, m1, d1] = start.split("-").map(Number);
  const [, m2, d2] = end.split("-").map(Number);
  return m1 === m2 ? `${m1}/${d1} ~ ${d2}` : `${m1}/${d1} ~ ${m2}/${d2}`;
}

function daysBetween(start, end) {
  const a = new Date(start), b = new Date(end);
  return Math.round((b - a) / 86400000) + 1;
}

/* 날짜 → 그날의 이벤트 목록 (endDate 있으면 range 처리) */
function eventsOn(dateStr) {
  const list = [];
  for (const v of VIDEOS) {
    for (const s of v.steps) {
      const start = s.date;
      const end = s.endDate || s.date;
      if (dateStr >= start && dateStr <= end) {
        list.push({ ...s, videoId: v.id, videoTitle: v.title, category: v.category, note: v.note, plan: v.plan });
      }
    }
  }
  return list;
}

/* 이번달 통계 — range step은 1건으로만 카운트 (월 겹침 기준) */
function monthStats(y, m) {
  const monthStart = `${y}-${pad(m)}-01`;
  const lastDay = new Date(y, m, 0).getDate();
  const monthEnd = `${y}-${pad(m)}-${pad(lastDay)}`;
  let total = 0, done = 0, shoots = 0, uploads = 0;
  for (const v of VIDEOS) {
    for (const s of v.steps) {
      const stepStart = s.date;
      const stepEnd = s.endDate || s.date;
      if (stepStart > monthEnd || stepEnd < monthStart) continue;
      total++;
      if (s.status === "완료") done++;
      if (s.type === "촬영" && s.status === "예정") shoots++;
      if (s.type === "업로드" && s.status === "예정") uploads++;
    }
  }
  return { total, done, shoots, uploads };
}

/* 다가오는 일정 (오늘 이후, 최대 8건) */
function upcomingEvents() {
  const t = today();
  const all = [];
  for (const v of VIDEOS) {
    for (const s of v.steps) {
      const stepEnd = s.endDate || s.date;
      if (stepEnd >= t && s.status !== "완료") {
        all.push({ ...s, videoTitle: v.title, videoId: v.id });
      }
    }
  }
  all.sort((a,b) => a.date.localeCompare(b.date));
  return all.slice(0, 8);
}

/* ─── 렌더링 ─── */
function renderStats() {
  const s = monthStats(viewYear, viewMonth);
  document.getElementById("stats").innerHTML = `
    <div class="stat"><div class="stat-label">이번달 일정</div><div class="stat-value">${s.total}건</div></div>
    <div class="stat"><div class="stat-label">완료</div><div class="stat-value">${s.done}건</div></div>
    <div class="stat"><div class="stat-label">예정 촬영</div><div class="stat-value">${s.shoots}건</div></div>
    <div class="stat"><div class="stat-label">예정 업로드</div><div class="stat-value">${s.uploads}건</div></div>`;
}

function renderCalendar() {
  const grid = document.getElementById("grid");
  const firstDow = new Date(viewYear, viewMonth - 1, 1).getDay();
  const daysInMonth = new Date(viewYear, viewMonth, 0).getDate();
  const todayStr = today();

  document.getElementById("month-label").textContent = `${viewYear}년 ${viewMonth}월`;

  let html = "";
  for (let i = 0; i < firstDow; i++) html += '<div class="day empty"></div>';

  for (let d = 1; d <= daysInMonth; d++) {
    const k = toKey(viewYear, viewMonth, d);
    const events = eventsOn(k);
    const dow = new Date(viewYear, viewMonth - 1, d).getDay();
    const cls = ["day"];
    if (events.length) cls.push("has-event");
    if (k === todayStr) cls.push("today");

    const dowCls = dow === 0 ? " sun" : dow === 6 ? " sat" : "";

    let pips = "";
    let trackBadges = "";
    if (events.length) {
      pips = '<div class="pips">';
      for (const ev of events.slice(0, 3)) {
        let pipCls;
        if (ev.status === "완료") pipCls = "pip pip-done";
        else if (ev.status === "예정" && ev.type === "업로드") pipCls = "pip pip-업로드-예정";
        else pipCls = `pip pip-${ev.type}`;
        let pipText = ev.type;
        if (ev.status === "완료") pipText = `${ev.type} 완료`;
        else if (ev.status === "진행중") pipText = `${ev.type} 중`;
        else if (ev.status === "예정") pipText = `${ev.type} 예정`;
        pips += `<div class="${pipCls}">${pipText}</div>`;
      }
      if (events.length > 3) pips += `<div class="pip" style="background:#a8a29e;">+${events.length - 3}</div>`;
      pips += '</div>';

      const trackMeta = {
        "회생 트랙": { cls: "tb-rehab", label: "개인회생" },
        "사례 트랙": { cls: "tb-case", label: "사례 분석" }
      };
      const cats = [...new Set(events.map(e => e.category))];
      const tbs = cats.map(c => {
        const m = trackMeta[c];
        return m
          ? `<span class="track-badge ${m.cls}">${m.label}</span>`
          : `<span class="track-badge">${c}</span>`;
      }).join("");
      trackBadges = `<div class="track-badges">${tbs}</div>`;
    }

    html += `<div class="${cls.join(" ")}" data-date="${k}"><div class="num${dowCls}">${d}</div>${trackBadges}${pips}</div>`;
  }
  grid.innerHTML = html;

  grid.querySelectorAll(".day.has-event").forEach(el => {
    el.addEventListener("click", () => selectDate(el.dataset.date));
  });
}

function selectDate(dateStr) {
  document.querySelectorAll(".day.selected").forEach(el => el.classList.remove("selected"));
  const el = document.querySelector(`.day[data-date="${dateStr}"]`);
  if (el) el.classList.add("selected");

  const events = eventsOn(dateStr);
  const detail = document.getElementById("detail");

  if (!events.length) {
    detail.innerHTML = `<div class="detail-date">${fmtKo(dateStr)}</div><div class="detail-empty">이 날은 일정이 없어요.</div>`;
    return;
  }

  let items = "";
  for (const ev of events) {
    let typeBadge;
    if (ev.status === "완료") {
      typeBadge = `<span class="badge badge-${ev.type}" style="opacity:.65">${ev.type}</span><span class="badge badge-done">완료</span>`;
    } else if (ev.status === "진행중") {
      typeBadge = `<span class="badge badge-${ev.type}">${ev.type}</span><span class="badge badge-doing">진행중</span>`;
    } else {
      typeBadge = `<span class="badge badge-${ev.type}">${ev.type}</span><span class="badge badge-예정">예정</span>`;
    }
    const timeBadge = ev.time ? `<span class="badge badge-time">${ev.time}</span>` : "";
    const catBadge = `<span class="badge badge-cat">${ev.category}</span>`;
    const note = ev.note ? `<div class="detail-note">${ev.note}</div>` : "";
    const planSummary = ev.plan && ev.plan.summary ? `<div class="plan-summary">${ev.plan.summary}</div>` : "";
    const planLink = ev.plan && ev.plan.url ? `<a class="plan-link" href="${ev.plan.url}" target="_blank" rel="noopener">기획안 전문 보기 →</a>` : "";
    const isRange = ev.endDate && ev.endDate !== ev.date;
    const rangeInfo = isRange
      ? `<div class="detail-range">기간: ${dateRangeLabel(ev.date, ev.endDate)} · 총 ${daysBetween(ev.date, ev.endDate)}일</div>`
      : "";
    items += `
      <div class="detail-item">
        <div class="detail-top">${typeBadge}${timeBadge}${catBadge}<span class="detail-id">${ev.videoId}</span></div>
        <div class="detail-title">${ev.videoTitle}</div>
        ${rangeInfo}
        ${note}
        ${planSummary}
        ${planLink}
      </div>`;
  }
  detail.innerHTML = `<div class="detail-date">${fmtKo(dateStr)}</div>${items}`;
}

function renderUpcoming() {
  const list = upcomingEvents();
  const el = document.getElementById("upcoming");
  if (!list.length) {
    el.innerHTML = '<h2>다가오는 일정</h2><div class="up-none">예정된 일정이 없습니다.</div>';
    return;
  }
  let rows = "";
  for (const ev of list) {
    const isRange = ev.endDate && ev.endDate !== ev.date;
    const dateText = isRange ? dateRangeLabel(ev.date, ev.endDate) : (() => {
      const [,m,d] = ev.date.split("-").map(Number);
      return `${m}/${d}`;
    })();
    const upTime = (!isRange && ev.time) ? `<span class="badge badge-time" style="font-size:10px;">${ev.time}</span>` : "";
    rows += `
      <div class="up-row">
        <div class="up-date">${dateText}</div>
        <span class="badge badge-${ev.type}" style="font-size:10px;">${ev.type}</span>
        ${upTime}
        <div class="up-title">${ev.videoTitle}</div>
        <span class="detail-id">${ev.videoId}</span>
      </div>`;
  }
  el.innerHTML = `<h2>다가오는 일정</h2><div class="up-list">${rows}</div>`;
}

function renderAll() {
  renderStats();
  renderCalendar();
  renderUpcoming();
  renderBoard();
  document.getElementById("detail").innerHTML = '<div class="detail-empty">날짜를 클릭하면 그 날의 일정을 볼 수 있어요.</div>';
}

/* ─── 진행 보드 ─── */
function videoStage(v) {
  const up = v.steps.find(s => s.type === "업로드");
  const shoot = v.steps.find(s => s.type === "촬영");
  if (up && up.status === "완료") return "done";
  if (shoot && shoot.status === "완료") return "wip";
  return "todo";
}

function progressDots(v) {
  const order = ["촬영", "편집", "업로드"];
  let html = '<div class="bcard-progress">';
  let done = 0;
  for (let i = 0; i < order.length; i++) {
    const t = order[i];
    const step = v.steps.find(s => s.type === t);
    let cls = "prog-dot";
    let title = t;
    if (!step) { cls += " upcoming"; title += " 없음"; }
    else if (step.status === "완료") { cls += " done"; title += " 완료"; done++; }
    else if (step.status === "진행중") { cls += " wip"; title += " 진행중"; }
    else { cls += " upcoming"; title += " 예정"; }
    html += `<span class="${cls}" title="${title}"></span>`;
    if (i < order.length - 1) html += '<span class="prog-arrow">→</span>';
  }
  html += `<span class="prog-label">${done}/${order.length} 완료</span>`;
  html += '</div>';
  return html;
}

function statusLine(v, stage) {
  const next = v.steps.find(s => s.status !== "완료");
  if (next) {
    const isRange = next.endDate && next.endDate !== next.date;
    const dateText = dateRangeLabel(next.date, next.endDate);
    const time = (!isRange && next.time) ? ` ${next.time}` : "";
    const verb = next.status === "진행중" ? "진행중" : "예정";
    return `<div class="bcard-next"><strong>${dateText}${time}</strong> · ${next.type} ${verb}</div>`;
  }
  if (stage === "done") {
    const up = v.steps.find(s => s.type === "업로드");
    if (up) {
      const dateText = dateRangeLabel(up.date, up.endDate);
      return `<div class="bcard-next done-line"><strong>${dateText}</strong> · 업로드 완료</div>`;
    }
  }
  return "";
}

function renderBoardCard(v, stage) {
  const planLink = v.plan && v.plan.url
    ? `<a class="plan-link" href="${v.plan.url}" target="_blank" rel="noopener">기획안 전문 보기 →</a>`
    : "";
  const noteLine = v.note ? `<div class="bcard-note">${v.note}</div>` : "";
  return `<div class="bcard">
    <div class="bcard-top">
      <span class="badge badge-cat">${v.category}</span>
      <span class="detail-id">${v.id}</span>
    </div>
    <div class="bcard-title">${v.title}</div>
    ${progressDots(v)}
    ${statusLine(v, stage)}
    ${noteLine}
    ${planLink}
  </div>`;
}

function renderBoard() {
  const todo = [], wip = [], done = [];
  for (const v of VIDEOS) {
    const stage = videoStage(v);
    if (stage === "todo") todo.push(v);
    else if (stage === "wip") wip.push(v);
    else done.push(v);
  }
  const dateOf = (v, type) => v.steps.find(s => s.type === type)?.date || "";
  todo.sort((a, b) => dateOf(a, "촬영").localeCompare(dateOf(b, "촬영")));
  wip.sort((a, b) => dateOf(a, "업로드").localeCompare(dateOf(b, "업로드")));
  done.sort((a, b) => dateOf(b, "업로드").localeCompare(dateOf(a, "업로드")));

  const empty = (msg) => `<div class="bcard-empty">${msg}</div>`;
  document.getElementById("board").innerHTML = `
    <div class="col col-todo">
      <div class="col-header"><div class="col-title">촬영 대기</div><div class="col-count">${todo.length}</div></div>
      ${todo.length ? todo.map(v => renderBoardCard(v, "todo")).join("") : empty("대기중인 영상이 없습니다.")}
    </div>
    <div class="col col-wip">
      <div class="col-header"><div class="col-title">편집 · 업로드 중</div><div class="col-count">${wip.length}</div></div>
      ${wip.length ? wip.map(v => renderBoardCard(v, "wip")).join("") : empty("진행중인 영상이 없습니다.")}
    </div>
    <div class="col col-done">
      <div class="col-header"><div class="col-title">업로드 완료</div><div class="col-count">${done.length}</div></div>
      ${done.length ? done.map(v => renderBoardCard(v, "done")).join("") : empty("아직 업로드된 영상이 없습니다.")}
    </div>`;
}

/* ─── 탭 전환 ─── */
document.querySelectorAll(".tab").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
  });
});

/* ─── 월 이동 ─── */
document.getElementById("btn-prev").addEventListener("click", () => {
  viewMonth--;
  if (viewMonth < 1) { viewMonth = 12; viewYear--; }
  renderAll();
});
document.getElementById("btn-next").addEventListener("click", () => {
  viewMonth++;
  if (viewMonth > 12) { viewMonth = 1; viewYear++; }
  renderAll();
});

/* ─── 초기화 ─── */
(async () => {
  const now = new Date();
  viewYear = now.getFullYear();
  viewMonth = now.getMonth() + 1;
  if (await loadData()) renderAll();
})();
</script>
</body>
</html>
